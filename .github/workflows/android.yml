
name: SJ AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  contents: read

env:
  MODEL_URL: https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf
  MODEL_SHA256: 7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d

jobs:

  model-validation:
    name: Download and Validate AI Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and Verify Model
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          echo "Downloading Qwen3 model..."

          curl -L --fail --retry 3 \
            "$MODEL_URL" \
            -o /tmp/model.gguf

          echo "Verifying SHA256..."

          echo "$MODEL_SHA256  /tmp/model.gguf" | sha256sum -c -

          echo "Checking GGUF structure..."

          python scripts/verify_gguf.py /tmp/model.gguf

          echo "Model verification successful."

      - name: Clone llama.cpp
        run: |
          git clone \
            --depth 1 \
            --branch b5214 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

      - name: Configure llama.cpp
        run: |
          cmake \
            -S /tmp/llama.cpp \
            -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=OFF

      - name: Build llama.cpp
        run: |
          cmake --build /tmp/llama.cpp/build \
            --config Release \
            --target llama-cli \
            -j2

      - name: Run Model Inference Test
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting SJ AI model inference test..."

          timeout 180 /tmp/llama.cpp/build/bin/llama-cli \
            -m /tmp/model.gguf \
            -p "Reply with exactly one word: READY" \
            -n 256 \
            -c 1024 \
            --temp 0 \
            --single-turn \
            --no-display-prompt \
            > /tmp/model-response.txt \
            2> /tmp/model-runtime.log

          echo "Model runtime log:"
          cat /tmp/model-runtime.log

          echo "Generated model response:"
          cat /tmp/model-response.txt

          if [ ! -s /tmp/model-response.txt ]; then
            echo "FAIL: Model did not generate any response."
            exit 1
          fi

          if ! tr -d '[:space:]' < /tmp/model-response.txt | grep -q .; then
            echo "FAIL: Model response is empty."
            exit 1
          fi

          echo "PASS: Model successfully loaded and generated text."

      - name: Upload Verified AI Model
        uses: actions/upload-artifact@v4
        with:
          name: sjai-model
          path: /tmp/model.gguf
          retention-days: 1

  android-build:
    name: Build SJ AI Android Release APK
    runs-on: ubuntu-latest
    needs: model-validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Verified AI Model
        uses: actions/download-artifact@v4
        with:
          name: sjai-model
          path: app/src/main/assets

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        run: |
          gradle --no-daemon assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          echo "Checking release APK..."

          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "FAIL: Release APK not found."
            exit 1
          fi

          ls -lh "$APK_FILE"

          echo "Release APK verification successful."

      - name: Upload SJ AI Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SJ-AI-Android-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
